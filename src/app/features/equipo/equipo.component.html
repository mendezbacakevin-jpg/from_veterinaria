<section class="team">
  <h2>Conoce a Nuestro Equipo</h2>
  <p class="lead">
    En <strong>Clínica Veterinaria Vida Animal</strong>, contamos con un equipo de profesionales dedicados al bienestar de tu mascota.
  </p>

  <div class="team-container">

    <div class="team-member" *ngFor="let miembro of equipo">
      <img [src]="miembro.imagen" [alt]="miembro.nombre">
      <h3>{{ miembro.nombre }}</h3>
      <p>{{ miembro.especialidad }}</p>
      <span class="description">{{ miembro.descripcion }}</span>
    </div>

  </div>
</section>

<div class="text-center mt-5">
  <blockquote class="blockquote fs-5 fst-italic">
    "Tu mascota merece la mejor atención. Cuidamos a tu familia con pasión."
  </blockquote>
</div>
